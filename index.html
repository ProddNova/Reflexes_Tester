<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FlashRead</title>
  <style>
    :root {
      --bg: #070b16;
      --panel: rgba(18, 24, 42, 0.88);
      --text: #eef3ff;
      --muted: #9aaad1;
      --accent: #79dbff;
      --accent2: #a88dff;
      --ok: #24d7a8;
      --danger: #ff7f8f;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(850px 500px at 85% -10%, rgba(121, 219, 255, 0.16), transparent),
        radial-gradient(650px 500px at -20% 120%, rgba(168, 141, 255, 0.22), transparent),
        var(--bg);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      backdrop-filter: blur(8px);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
    }

    .title { font-weight: 700; }
    .sub { color: var(--muted); font-size: .82rem; }
    .chip {
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 5px 9px;
      color: var(--muted);
      font-size: .75rem;
    }

    .screen { height: 100%; overflow: auto; padding: 12px; }
    .hidden { display: none !important; }

    .tabs { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,.03); }
    .tab {
      border: 0; border-radius: 10px; padding: 10px 6px; font-weight: 650;
      color: var(--muted); background: transparent;
    }
    .tab.active { background: rgba(121, 219, 255, .15); color: #e6f9ff; }

    .panel {
      background: rgba(0,0,0,.2);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
      display: grid;
      gap: 10px;
    }

    textarea, input[type="url"], input[type="number"], input[type="file"] {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font: inherit;
      padding: 12px;
      outline: none;
    }
    textarea { resize: vertical; min-height: 170px; }

    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .grow { flex: 1; }

    button {
      border: 0; border-radius: 12px; padding: 11px 14px;
      color: #fff; font: inherit; font-weight: 700;
      background: linear-gradient(120deg, var(--accent), var(--accent2));
    }
    button.secondary {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      font-weight: 600;
    }
    button.danger {
      background: rgba(255,127,143,.17);
      border: 1px solid rgba(255,127,143,.35);
      color: #ffe2e8;
    }

    .hint { color: var(--muted); font-size: .8rem; }
    .status { color: var(--ok); font-size: .83rem; min-height: 16px; }

    .reader {
      position: relative;
      height: calc(100dvh - 24px - var(--safe-top) - var(--safe-bottom));
      border-radius: 16px;
      overflow: hidden;
      background: rgba(8, 13, 28, .92);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      display: grid;
      place-items: center;
    }

    .word {
      font-size: clamp(2.2rem, 12vw, 5rem);
      font-weight: 800;
      letter-spacing: .2px;
      text-align: center;
      text-wrap: balance;
      padding: 0 18px;
    }

    .scrub-overlay {
      position: absolute;
      inset: auto 10px 10px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(7,11,22,.86);
      backdrop-filter: blur(8px);
      padding: 10px;
      display: none;
      gap: 8px;
    }
    .scrub-overlay.show { display: grid; }

    .mini {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .8rem;
      gap: 8px;
    }
    .bar {
      height: 6px;
      background: rgba(255,255,255,.1);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar > div {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .ctx {
      color: #dce6ff;
      font-size: .92rem;
      line-height: 1.4;
      max-height: 108px;
      overflow: auto;
      display: grid;
      gap: 4px;
      padding-right: 4px;
    }
    .ctx-line { opacity: .5; }
    .ctx-line.active { opacity: 1; }
    .aw {
      color: #091126;
      background: linear-gradient(120deg, #7ee0ff, #c3b8ff);
      border-radius: 6px;
      padding: 0 4px;
      font-weight: 750;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="card header">
      <div>
        <div class="title">FlashRead</div>
        <div class="sub">RSVP mobile, tutto locale</div>
      </div>
      <div class="chip" id="saveChip">Nessuna sessione</div>
    </header>

    <main class="card">
      <section class="screen" id="setupScreen">
        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="paste">Incolla</button>
          <button class="tab" data-tab="file">File</button>
          <button class="tab" data-tab="url">URL</button>
        </div>

        <div id="panel-paste" class="panel">
          <textarea id="textInput" placeholder="Incolla testo..."></textarea>
          <div class="row">
            <button id="useText" class="grow">Usa testo</button>
            <button id="demo" class="secondary">Demo</button>
          </div>
        </div>

        <div id="panel-file" class="panel hidden">
          <input id="fileInput" type="file" accept=".txt,.md,.pdf,.epub" />
          <div class="status" id="fileStatus"></div>
        </div>

        <div id="panel-url" class="panel hidden">
          <input id="urlInput" type="url" placeholder="https://..." />
          <div class="row">
            <button id="importUrl" class="grow">Importa URL</button>
            <button id="urlNote" class="secondary">Note</button>
          </div>
          <div class="status" id="urlStatus"></div>
        </div>

        <div class="panel">
          <div class="row">
            <div class="grow">
              <div class="hint">WPM iniziali</div>
              <input id="wpmInput" type="number" min="60" max="1200" value="320" />
            </div>
            <div class="grow">
              <div class="hint">Parole per riga contesto</div>
              <input id="lineInput" type="number" min="6" max="20" value="10" />
            </div>
          </div>
          <button id="start">Avvia lettura</button>
          <button id="restore" class="secondary">Riprendi sessione</button>
          <button id="clear" class="danger">Azzera dati</button>
          <div class="hint">Lettura: tieni premuto = play. Su/giù = WPM. Destra/sinistra = timeline. Doppio tap = torna a setup.</div>
        </div>
      </section>

      <section class="screen hidden" id="readerScreen" style="padding:0; overflow:hidden;">
        <div class="reader" id="readerPad">
          <div id="focusWord" class="word">—</div>

          <div class="scrub-overlay" id="scrubOverlay">
            <div class="mini">
              <span id="wpmLabel">320 WPM</span>
              <span id="idxLabel">0 / 0</span>
            </div>
            <div class="bar"><div id="barFill"></div></div>
            <div class="ctx" id="ctx"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'flashread_v2';

    const state = {
      text: '', tokens: [], index: 0,
      wpm: 320, lineSize: 10,
      playing: false, raf: null, lastTick: 0,
      hold: false, pointerId: null,
      sx: 0, sy: 0, baseIndex: 0, baseWpm: 320,
      lock: null, // 'x'|'y'
      lines: []
    };

    const el = {
      setup: document.getElementById('setupScreen'),
      reader: document.getElementById('readerScreen'),
      tabs: document.getElementById('tabs'),
      textInput: document.getElementById('textInput'),
      useText: document.getElementById('useText'),
      demo: document.getElementById('demo'),
      fileInput: document.getElementById('fileInput'),
      fileStatus: document.getElementById('fileStatus'),
      urlInput: document.getElementById('urlInput'),
      importUrl: document.getElementById('importUrl'),
      urlNote: document.getElementById('urlNote'),
      urlStatus: document.getElementById('urlStatus'),
      wpmInput: document.getElementById('wpmInput'),
      lineInput: document.getElementById('lineInput'),
      start: document.getElementById('start'),
      restore: document.getElementById('restore'),
      clear: document.getElementById('clear'),
      saveChip: document.getElementById('saveChip'),
      readerPad: document.getElementById('readerPad'),
      focusWord: document.getElementById('focusWord'),
      scrubOverlay: document.getElementById('scrubOverlay'),
      wpmLabel: document.getElementById('wpmLabel'),
      idxLabel: document.getElementById('idxLabel'),
      barFill: document.getElementById('barFill'),
      ctx: document.getElementById('ctx')
    };

    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
    const tok = t => (t || '').replace(/\s+/g, ' ').trim().split(/\s+/).filter(Boolean);
    const esc = s => s.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

    function save() {
      if (!state.text) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        text: state.text, index: state.index, wpm: state.wpm, lineSize: state.lineSize, ts: Date.now()
      }));
      el.saveChip.textContent = 'Sessione salvata';
    }

    function load() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }
      catch { return null; }
    }

    function buildLines() {
      state.lines = [];
      for (let i = 0; i < state.tokens.length; i += state.lineSize) {
        state.lines.push({ start: i, words: state.tokens.slice(i, i + state.lineSize) });
      }
    }

    function setText(t) {
      state.text = t || '';
      state.tokens = tok(state.text);
      state.index = clamp(state.index, 0, Math.max(0, state.tokens.length - 1));
      buildLines();
      renderWord();
      save();
    }

    function renderWord() {
      const total = state.tokens.length;
      const idx = total ? clamp(state.index, 0, total - 1) : 0;
      state.index = idx;
      el.focusWord.textContent = total ? state.tokens[idx] : '—';

      el.wpmLabel.textContent = `${Math.round(state.wpm)} WPM`;
      el.idxLabel.textContent = `${total ? idx + 1 : 0} / ${total}`;
      el.barFill.style.width = `${total ? ((idx + 1) / total) * 100 : 0}%`;

      if (!el.scrubOverlay.classList.contains('show')) return;
      const center = Math.floor(idx / state.lineSize);
      const from = clamp(center - 3, 0, Math.max(0, state.lines.length - 1));
      const to = clamp(center + 3, 0, Math.max(0, state.lines.length - 1));
      let html = '';
      for (let li = from; li <= to; li++) {
        const line = state.lines[li];
        if (!line) continue;
        const local = idx - line.start;
        const row = line.words.map((w, i) => i === local ? `<span class="aw">${esc(w)}</span>` : esc(w)).join(' ');
        html += `<div class="ctx-line ${li === center ? 'active' : ''}">${row}</div>`;
      }
      el.ctx.innerHTML = html;
    }

    function tick(ts) {
      if (!state.playing) return;
      if (!state.lastTick) state.lastTick = ts;
      const dt = 60000 / Math.max(60, state.wpm);
      if (ts - state.lastTick >= dt) {
        state.lastTick = ts;
        if (state.index < state.tokens.length - 1) {
          state.index += 1;
          renderWord();
          if (state.index % 10 === 0) save();
        } else {
          stopPlay();
        }
      }
      state.raf = requestAnimationFrame(tick);
    }

    function startPlay() {
      if (!state.tokens.length || state.playing) return;
      state.playing = true;
      state.lastTick = 0;
      state.raf = requestAnimationFrame(tick);
    }

    function stopPlay() {
      state.playing = false;
      if (state.raf) cancelAnimationFrame(state.raf);
      state.raf = null;
      save();
    }

    function show(screen) {
      el.setup.classList.toggle('hidden', screen !== 'setup');
      el.reader.classList.toggle('hidden', screen !== 'reader');
    }

    function openScrub() {
      el.scrubOverlay.classList.add('show');
      renderWord();
    }

    function closeScrub() {
      el.scrubOverlay.classList.remove('show');
    }

    function pd(e) {
      if (!state.tokens.length) return;
      state.pointerId = e.pointerId;
      state.hold = true;
      state.sx = e.clientX;
      state.sy = e.clientY;
      state.baseIndex = state.index;
      state.baseWpm = state.wpm;
      state.lock = null;
      el.readerPad.setPointerCapture(e.pointerId);
      closeScrub();
      startPlay();
      e.preventDefault();
    }

    function pm(e) {
      if (!state.hold || e.pointerId !== state.pointerId) return;
      const dx = e.clientX - state.sx;
      const dy = e.clientY - state.sy;
      const ax = Math.abs(dx);
      const ay = Math.abs(dy);

      if (!state.lock && (ax > 14 || ay > 14)) {
        if (ay > ax * 1.35) state.lock = 'y';
        else if (ax > ay * 1.35) state.lock = 'x';
      }

      if (state.lock === 'y') {
        const delta = -dy * 1.7;
        state.wpm = clamp(state.baseWpm + delta, 60, 1200);
        if (!state.playing) startPlay();
        closeScrub();
        renderWord();
      } else if (state.lock === 'x') {
        stopPlay();
        const jump = Math.round(dx / 11);
        state.index = clamp(state.baseIndex + jump, 0, Math.max(0, state.tokens.length - 1));
        openScrub();
        renderWord();
      }

      e.preventDefault();
    }

    function pu(e) {
      if (e.pointerId !== state.pointerId) return;
      state.hold = false;
      state.pointerId = null;
      state.lock = null;
      stopPlay();
      closeScrub();
      e.preventDefault();
    }

    async function readFile(file) {
      if (!file) return;
      const ext = file.name.toLowerCase().split('.').pop();
      el.fileStatus.textContent = 'Caricamento...';
      try {
        if (ext === 'txt' || ext === 'md') {
          setText(await file.text());
          el.fileStatus.textContent = `Caricato: ${file.name}`;
          return;
        }
        if (ext === 'pdf') {
          const mod = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
          mod.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
          const pdf = await mod.getDocument({ data: await file.arrayBuffer() }).promise;
          let t = '';
          for (let p = 1; p <= pdf.numPages; p++) {
            const page = await pdf.getPage(p);
            const c = await page.getTextContent();
            t += c.items.map(i => i.str).join(' ') + ' ';
          }
          setText(t);
          el.fileStatus.textContent = `PDF importato (${pdf.numPages} pagine)`;
          return;
        }
        if (ext === 'epub') {
          const raw = await file.arrayBuffer();
          const txt = new TextDecoder('utf-8').decode(raw.slice(0, 220000)).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
          setText(txt);
          el.fileStatus.textContent = 'EPUB convertito in modalità compatibilità';
          return;
        }
        el.fileStatus.textContent = 'Formato non supportato';
      } catch {
        el.fileStatus.textContent = 'Errore di parsing file';
      }
    }

    async function importUrl(url) {
      if (!url) return;
      el.urlStatus.textContent = 'Import...';
      try {
        const proxy = `https://r.jina.ai/http://${url.replace(/^https?:\/\//, '')}`;
        const r = await fetch(proxy);
        if (!r.ok) throw new Error('http');
        const txt = (await r.text()).replace(/```[\s\S]*?```/g, ' ').replace(/\s+/g, ' ').trim();
        if (txt.length < 60) throw new Error('short');
        setText(txt);
        el.urlStatus.textContent = 'Import completato';
      } catch {
        el.urlStatus.textContent = 'Import fallito (CORS/sito)';
      }
    }

    function applyConfig() {
      state.wpm = clamp(Number(el.wpmInput.value || 320), 60, 1200);
      state.lineSize = clamp(Number(el.lineInput.value || 10), 6, 20);
      buildLines();
      renderWord();
      save();
    }

    function startReader() {
      applyConfig();
      if (!state.tokens.length) return alert('Importa prima un testo.');
      show('reader');
      renderWord();
    }

    function wireTabs() {
      el.tabs.addEventListener('click', e => {
        const b = e.target.closest('.tab');
        if (!b) return;
        const t = b.dataset.tab;
        [...el.tabs.querySelectorAll('.tab')].forEach(x => x.classList.toggle('active', x === b));
        ['paste','file','url'].forEach(n => document.getElementById(`panel-${n}`).classList.toggle('hidden', n !== t));
      });
    }

    function wire() {
      wireTabs();

      el.useText.addEventListener('click', () => {
        const t = el.textInput.value.trim();
        if (!t) return;
        state.index = 0;
        setText(t);
      });

      el.demo.addEventListener('click', () => {
        el.textInput.value = 'Questa è una demo RSVP. Tieni premuto per far avanzare le parole. Trascina in alto o in basso per regolare la velocità. Trascina a destra o sinistra per muoverti nella timeline del testo.';
        el.useText.click();
      });

      el.fileInput.addEventListener('change', e => readFile(e.target.files[0]));
      el.importUrl.addEventListener('click', () => importUrl(el.urlInput.value.trim()));
      el.urlNote.addEventListener('click', () => alert('Import URL solo frontend: alcuni siti bloccano la lettura esterna.'));

      el.wpmInput.addEventListener('change', applyConfig);
      el.lineInput.addEventListener('change', applyConfig);
      el.start.addEventListener('click', startReader);

      el.restore.addEventListener('click', () => {
        const s = load();
        if (!s?.text) return alert('Nessuna sessione trovata');
        state.index = s.index || 0;
        state.wpm = clamp(s.wpm || 320, 60, 1200);
        state.lineSize = clamp(s.lineSize || 10, 6, 20);
        el.textInput.value = s.text;
        el.wpmInput.value = String(state.wpm);
        el.lineInput.value = String(state.lineSize);
        setText(s.text);
      });

      el.clear.addEventListener('click', () => {
        localStorage.removeItem(STORAGE_KEY);
        state.text = ''; state.tokens = []; state.index = 0;
        el.textInput.value = '';
        el.fileStatus.textContent = '';
        el.urlStatus.textContent = '';
        el.saveChip.textContent = 'Nessuna sessione';
        stopPlay();
        renderWord();
      });

      // double tap to return setup
      let lastTap = 0;
      el.readerPad.addEventListener('pointerup', e => {
        const now = Date.now();
        if (now - lastTap < 300) {
          stopPlay();
          closeScrub();
          show('setup');
        }
        lastTap = now;
      }, { passive: true });

      el.readerPad.addEventListener('pointerdown', pd, { passive: false });
      el.readerPad.addEventListener('pointermove', pm, { passive: false });
      el.readerPad.addEventListener('pointerup', pu, { passive: false });
      el.readerPad.addEventListener('pointercancel', pu, { passive: false });

      document.addEventListener('selectstart', e => {
        if (!el.reader.classList.contains('hidden')) e.preventDefault();
      });
      document.addEventListener('contextmenu', e => {
        if (!el.reader.classList.contains('hidden')) e.preventDefault();
      });
      document.addEventListener('visibilitychange', () => { if (document.hidden) stopPlay(); });
    }

    function boot() {
      wire();
      const s = load();
      if (s?.text) {
        state.index = s.index || 0;
        state.wpm = clamp(s.wpm || 320, 60, 1200);
        state.lineSize = clamp(s.lineSize || 10, 6, 20);
        el.textInput.value = s.text;
        el.wpmInput.value = String(state.wpm);
        el.lineInput.value = String(state.lineSize);
        setText(s.text);
        el.saveChip.textContent = 'Sessione trovata';
      }
      renderWord();
    }

    boot();
  </script>
</body>
</html>
